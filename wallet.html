<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arc Wallet - Arcadia</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111318;
            color: white;
            text-align: center;
        }

        header {
            background: #1b1e27;
            padding: 18px;
            text-align: left;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #5865f2;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .wallet {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: #1b1e27;
            border-radius: 16px;
        }

        .balance {
            font-size: 40px;
            font-weight: bold;
            margin: 25px 0;
        }

        .info {
            color: #b9bdc9;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<header>
    <a href="/my-game-platform/">← Back to Arcadia</a>
</header>

<div class="wallet">

    <h1>◆ Arc Wallet</h1>

    <p>Your Arcadia balance</p>

    <div class="balance">
        ◆ 250 Arcs
    </div>

    <div class="info">
        <p>🎮 Play games</p>
        <p>🏆 Complete achievements</p>
        <p>💡 Participate in Arcadia</p>
    </div>

</div>

</body>

</html>
