<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profiles - Arcadia</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111318;
            color: white;
        }

        header {
            background: #1b1e27;
            padding: 18px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #5865f2;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .profile-card {
            display: block;
            background: #1b1e27;
            color: white;
            text-decoration: none;
            padding: 20px;
            margin-top: 15px;
            border-radius: 14px;
        }

        .profile-card:hover {
            background: #252936;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            float: left;
            margin-right: 15px;
        }

        .username {
            font-size: 20px;
            font-weight: bold;
        }

        .description {
            color: #b9bdc9;
            margin-top: 5px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

<header>
    <a href="/my-game-platform/">← Back to Arcadia</a>
</header>

<div class="container">

    <h1>👤 Profiles</h1>

    <p style="text-align: center; color: #b9bdc9;">
        Discover people in the Arcadia community.
    </p>

    <a class="profile-card" href="/my-game-platform/profile.html">

        <div class="avatar">
            🎮
        </div>

        <div class="username">
            @Arcadia ✓
        </div>

        <div class="description">
            The official Arcadia account.
        </div>

        <div class="clear"></div>

    </a>

</div>

</body>

</html>
